<!-- ========================================================================= -->
<!-- 2. INTERACTIVE CONTROL AND DEMO TOOLBAR                                    -->
<!-- The DSN link label is abbreviated: at full width it competed with the      -->
<!-- buttons and pushed the row out of the viewport.                            -->
<!-- ========================================================================= -->
<div class="control-toolbar">
  <div class="toolbar-group toolbar-link" title="Deep Space Network link — propagation delay to Earth">
    <span class="link-dot" aria-hidden="true"></span>
    <span class="link-label">DSN LINK</span>
    <span id="dsnLatency" class="link-value">14 min · Store-and-Forward · Sol 120</span>
  </div>
  <div class="toolbar-group">
    <button id="btnAudioToggle" class="btn-hud" onclick="window.hudController.toggleAudio()"
            title="Enable or mute the procedural audio effects">🔊 AUDIO</button>
    <button class="btn-hud" onclick="window.hudController.restoreNominalMode()"
            title="Reset the telemetry to nominal values">NOMINAL MODE</button>
    <button class="btn-hud btn-hud-danger" onclick="window.hudController.activateCrisisMode()"
            title="Inject the day 95 crisis scenario">SIMULATE CRISIS</button>
    <button class="btn-hud" onclick="window.hudController.toggleModal()"
            title="Show the critical alert modal window">VIEW ALERT</button>
  </div>
</div>
