<dialog id="modalGames" class="arcade-modal" aria-labelledby="gamesTitle">
  <header class="arcade-header">
    <div><div class="arcade-eyebrow">HELIOS · GAME ZONE</div><h2 id="gamesTitle">Choose your next match</h2></div>
    <button type="button" class="btn-hud arcade-close" id="btnCloseGames" aria-label="Close games">✕</button>
  </header>
  <div id="gamesCatalog" class="arcade-catalog-view">
    <p class="arcade-catalog-intro">Eight games for a break. Pick one to start.</p>
    <div id="gamesCatalogGrid" class="arcade-catalog-grid"></div>
    <p id="gamesLoadMessage" class="arcade-catalog-note" role="status">Touch and keyboard controls. Your match pauses when you leave the window.</p>
  </div>
  <div id="gamesPlay" class="arcade-play-view" hidden>
    <div class="arcade-play-toolbar">
      <button type="button" class="btn-hud" id="btnGamesBack">‹ All games</button>
      <span id="gameScore" class="arcade-score"></span>
      <button type="button" class="btn-hud" id="btnGamesRestart">Restart</button>
    </div>
    <div class="arcade-play-layout">
      <div class="arcade-board-space" id="gameBoard"></div>
      <aside class="arcade-controls">
        <h3>How to play</h3><p id="gameInstructions"></p>
        <div id="gameStatus" class="arcade-game-status" role="status" aria-live="polite"></div>
        <button type="button" class="btn-hud arcade-start" id="btnGamesPause">Start</button>
        <div class="arcade-dpad" id="gameDpad" role="group" aria-label="Game direction">
          <button type="button" class="btn-hud" data-game-direction="up" aria-label="Up">▲</button>
          <button type="button" class="btn-hud" data-game-direction="left" aria-label="Left">◀</button>
          <button type="button" class="btn-hud" data-game-direction="down" aria-label="Down">▼</button>
          <button type="button" class="btn-hud" data-game-direction="right" aria-label="Right">▶</button>
        </div>
      </aside>
    </div>
  </div>
</dialog>
