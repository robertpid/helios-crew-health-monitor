<!-- ========================================================================= -->
<!-- 1. COCKPIT HUD HEADER (PRESENTATION LAYER)                                 -->
<!-- Three groups in one row: brand · navigation · crew member.                 -->
<!-- The tab labels are short on purpose; the full description lives in the     -->
<!-- title, instead of taking permanent width in the bar.                       -->
<!-- ========================================================================= -->
<header class="hud-header">
  <div class="brand-wrapper">
    <div class="brand-title">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
        <path d="M2 12h20"></path>
      </svg>
      H.E.L.I.O.S.
    </div>
    <div class="brand-sub">
      CREW HEALTH &amp; HABITAT MONITOR<br>
      <span style="color:var(--c-cyan-ink);">DEEP SPACE EXPEDITION · SOL 120</span>
    </div>
  </div>

  <!-- NAVIGATION BETWEEN VIEWS -->
  <nav class="nav-tabs-wrapper" aria-label="Cockpit views">
    <button class="nav-tab-btn active" onclick="window.hudController.changeView('biomedical')"
            title="View 1 — Biomedical and anatomical hologram">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
      <span class="tab-index">1</span>
      <span class="tab-text">BIOMEDICAL</span>
    </button>
    <button class="nav-tab-btn" onclick="window.hudController.changeView('environmental')"
            title="View 2 — Environment and space habitat">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </svg>
      <span class="tab-index">2</span>
      <span class="tab-text">ENVIRONMENT</span>
    </button>
    <button class="nav-tab-btn" onclick="window.hudController.changeView('matrix')"
            title="View 3 — Wellbeing, routines and the ASTRA assistant">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span class="tab-index">3</span>
      <span class="tab-text">WELLBEING</span>
    </button>
    <button class="nav-tab-btn" onclick="window.hudController.changeView('support')" title="View 4 — ASTRA, assessments, mail and the technical matrix"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="tab-index">4</span><span class="tab-text">SUPPORT</span></button>
    <button id="navTabSurgeon" class="nav-tab-btn" onclick="window.hudController.changeView('surgeon')" title="View 5 — Flight Surgeon's Exclusive Console (Dr. Marcus Vance)" style="display:none; border-color:rgba(168,85,247,0.5);"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span class="tab-index" style="color:#c084fc;">5</span><span class="tab-text" style="color:#e9d5ff;">SURGEON</span></button>
  </nav>

  <!-- CREW MEMBER STATUS / ACCESS -->
  <div class="crew-status-indicator">
    <button class="astro-tag" onclick="window.hudController.openLoginModal()"
            title="Switch crew member or enter the access PIN">
      <span id="userAvatarTag" aria-hidden="true">👨‍🚀</span>
      <span class="astro-names">
        <span id="userIdentTag">ASTRONAUT A01</span>
        <small id="userRoleTag">Alex Mercer</small>
      </span>
    </button>
    <button class="btn-hud btn-icon" onclick="window.hudController.openLoginModal()"
            title="Switch user or crew profile" aria-label="Sign in">🔑</button>
    <div id="statusPill" class="badge-status status-stable">STABLE</div>
  </div>
</header>
